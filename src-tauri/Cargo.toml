[package]
name = "meshguard"
version = "0.1.0"
edition = "2021"
description = "Secure P2P messenger for Meshtastic devices — no scanning, direct encrypted pairing"
license = "MIT"

[lib]
name = "meshguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
meshtastic = { version = "0.1", features = ["bluetooth-le"] }
btleplug = "0.11"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
meshguard-core = { path = "../crates/meshguard-core" }
meshguard-store = { path = "../crates/meshguard-store" }
meshguard-engine = { path = "../crates/meshguard-engine" }
meshguard-mqtt = { path = "../crates/meshguard-mqtt" }
# HTTPS to the MeshGuard relay enrollment service (ADR-007); rustls with ring.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
zeroize = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }

[target.'cfg(target_os = "android")'.dependencies]
# JNI entry points for the Kotlin foreground service (ADR-001 option D).
jni = "0.21.1"


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Wi-Fi radio discovery (_meshtastic._tcp). Android uses NsdManager instead,
# which handles the multicast lock for us.
mdns-sd = "0.21.6"
# Desktop vault key in the OS keyring (ADR-005 §3). Android uses Keystore.
keyring = "4.2.0"

[dev-dependencies]
