[package]
name = "meshguard-relay-live-tests"
version = "0.1.0"
edition = "2021"
description = "Live tests of the MeshGuard relay server kit against a local broker (run-tests.sh)"
license = "MIT"
publish = false

[dev-dependencies]
meshguard-mqtt = { path = "../../../../crates/meshguard-mqtt" }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
zeroize = "1"
