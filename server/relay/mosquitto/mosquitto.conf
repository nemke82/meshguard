# MeshGuard relay broker (ADR-007). Messages are never written to disk.
allow_anonymous false

# No retained messages, no message database on disk.
retain_available false
persistence false

# A disconnected session (and anything queued for it) is dropped after
# 3 days. Message lifetime is capped at 24 h by the broker patch.
persistent_client_expiration 3d

max_packet_size 4096
max_queued_messages 200
max_inflight_messages 20
global_max_connections 5000

# Errors and warnings only: no connection log, no topics, no usernames.
log_dest stdout
log_type error
log_type warning
connection_messages false

# Accounts and access rules (the only data kept on disk: usernames,
# salted password hashes and roles).
plugin /opt/mosquitto/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynsec.json

# Per-client subscription and publish-rate limits.
plugin /opt/mosquitto/lib/meshguard_limits.so
plugin_opt_max_subscriptions 64
plugin_opt_burst 20
plugin_opt_rate_per_sec 1

# Public: MQTT over TLS only. Certificates are reloaded on SIGHUP.
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2

# Local only: the enrollment service manages accounts here.
listener 1884 127.0.0.1
