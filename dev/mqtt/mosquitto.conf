# Local development / integration tests ONLY. Never expose this broker.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

per_listener_settings false
allow_anonymous false
password_file /mosquitto/gen/passwd
acl_file /mosquitto/config/acl

# TLS only. The port is published on 127.0.0.1 by run-tests.sh.
listener 8883
cafile /mosquitto/gen/ca.crt
certfile /mosquitto/gen/server.crt
keyfile /mosquitto/gen/server.key
tls_version tlsv1.2

max_packet_size 4096
max_queued_messages 1000
persistent_client_expiration 7d
