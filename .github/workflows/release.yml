name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────
  # Android APK
  # ──────────────────────────────────────────────
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "28.2.13676358"
      # Step `if:` cannot read secrets directly.
      PLAY_UPLOAD: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          # Semver for Cargo/Tauri (strip leading zeros): v2026.03.25 → 2026.3.25
          RAW=${GITHUB_REF_NAME#v}
          MAJOR=$(echo "$RAW" | cut -d. -f1)
          MINOR=$(echo "$RAW" | cut -d. -f2 | sed 's/^0*//' | sed 's/^$/0/')
          PATCH=$(echo "$RAW" | cut -d. -f3 | sed 's/^0*//' | sed 's/^$/0/')
          SEMVER="${MAJOR}.${MINOR}.${PATCH}"
          echo "Setting semver to $SEMVER"
          sed -i "s/\"version\": \".*\"/\"version\": \"$SEMVER\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$SEMVER\"/" src-tauri/Cargo.toml

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the legacy `tools` package,
          # which current SDK repositories no longer publish, so sdkmanager
          # fails. Install only what the build needs.
          packages: "platform-tools"

      - name: Install Android NDK
        # NDK r28+ links native libraries with 16 KB page alignment by default,
        # which Google Play requires for apps targeting Android 15+.
        run: sdkmanager "ndk;${NDK_VERSION}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: ui
        run: npm install

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Restore signing keystore
        # A stable key is mandatory: Android refuses to update an app whose
        # signature changed, so a throwaway key would break every upgrade.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/release/google-play.md"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/meshguard.jks"

      - name: Initialize Android project
        run: cargo tauri android init

      - name: Patch Android project with BLE permissions
        run: bash scripts/patch-android.sh

      - name: Build Android APK and App Bundle (release)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: cargo tauri android build --apk --aab

      - name: Sign APK and App Bundle
        id: apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # File name: YYYYMMDD format (no dots)
          FILEVER=$(echo "${GITHUB_REF_NAME#v}" | tr -d '.')
          BT="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools/" | sort -V | tail -1)"
          KS="$RUNNER_TEMP/meshguard.jks"

          UNSIGNED=$(find src-tauri/gen/android -name "*-unsigned.apk" -type f | head -1)
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED=$(find src-tauri/gen/android -name "*.apk" -type f | head -1)
          fi
          AAB_IN=$(find src-tauri/gen/android -name "*.aab" -type f | head -1)
          test -n "$UNSIGNED" && test -n "$AAB_IN"

          # APK: align (16 KB for uncompressed native libraries), sign, verify
          ALIGNED="$RUNNER_TEMP/meshguard-aligned.apk"
          "$BT/zipalign" -P 16 -f 4 "$UNSIGNED" "$ALIGNED"
          DEST="meshguard-${FILEVER}-android.apk"
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$DEST" \
            "$ALIGNED"
          "$BT/apksigner" verify --print-certs "$DEST" | grep -E "SHA-256|DN"
          cp "$DEST" "meshguard-android.apk"

          # AAB for Google Play: signed with the upload key
          AAB="meshguard-${FILEVER}.aab"
          cp "$AAB_IN" "$AAB"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$KS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            "$AAB" "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$AAB" | tail -1

          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "stable_path=meshguard-android.apk" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

          rm -f "$KS" "$ALIGNED"

      - name: Check 16 KB page alignment of native libraries
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools/" | sort -V | tail -1)"
          "$BT/zipalign" -c -P 16 4 "${{ steps.apk.outputs.path }}"
          mkdir -p "$RUNNER_TEMP/so" && unzip -q -o "${{ steps.apk.outputs.path }}" 'lib/*' -d "$RUNNER_TEMP/so"
          fail=0
          for so in $(find "$RUNNER_TEMP/so/lib" -name '*.so'); do
            case "$so" in */arm64-v8a/*|*/x86_64/*) ;; *) continue ;; esac
            for a in $(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}'); do
              if [ $((a)) -lt 16384 ]; then
                echo "::error::$so has LOAD alignment $a (< 16 KB)"; fail=1
              fi
            done
          done
          exit $fail

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.stable_path }}

      - name: Upload App Bundle artifact
        # Kept as a workflow artifact, not a release asset: the AAB is only
        # useful to Google Play.
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: ${{ steps.apk.outputs.aab }}

      - name: Upload to Google Play (internal testing, draft)
        # Optional: runs only when the service account secret is configured.
        # Drafts are never shown to users until promoted in Play Console.
        if: env.PLAY_UPLOAD == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.meshguard.app
          releaseFiles: ${{ steps.apk.outputs.aab }}
          track: internal
          status: draft

  # ──────────────────────────────────────────────
  # Linux — Ubuntu (.deb + .AppImage)
  # ──────────────────────────────────────────────
  build-linux-ubuntu:
    name: Linux (Ubuntu — deb/AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          RAW=${GITHUB_REF_NAME#v}
          MAJOR=$(echo "$RAW" | cut -d. -f1)
          MINOR=$(echo "$RAW" | cut -d. -f2 | sed 's/^0*//' | sed 's/^$/0/')
          PATCH=$(echo "$RAW" | cut -d. -f3 | sed 's/^0*//' | sed 's/^$/0/')
          SEMVER="${MAJOR}.${MINOR}.${PATCH}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$SEMVER\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$SEMVER\"/" src-tauri/Cargo.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps & build
        working-directory: ui
        run: |
          npm install
          npm run build

      - name: Build Tauri (deb + AppImage)
        run: cargo tauri build

      - name: Collect artifacts
        id: artifacts
        run: |
          FILEVER=$(echo "${GITHUB_REF_NAME#v}" | tr -d '.')
          mkdir -p release-artifacts

          # .deb
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -1)
          if [ -n "$DEB" ]; then
            cp "$DEB" "release-artifacts/meshguard-${FILEVER}-amd64.deb"
          fi

          # .AppImage
          AI=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" | head -1)
          if [ -n "$AI" ]; then
            cp "$AI" "release-artifacts/meshguard-${FILEVER}-x86_64.AppImage"
            chmod +x "release-artifacts/meshguard-${FILEVER}-x86_64.AppImage"
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-ubuntu
          path: release-artifacts/

  # ──────────────────────────────────────────────
  # Linux — RHEL/Fedora (.rpm)
  # ──────────────────────────────────────────────
  build-linux-rpm:
    name: Linux (RHEL/Fedora — RPM)
    runs-on: ubuntu-22.04
    container:
      image: fedora:39
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          RAW=${GITHUB_REF_NAME#v}
          MAJOR=$(echo "$RAW" | cut -d. -f1)
          MINOR=$(echo "$RAW" | cut -d. -f2 | sed 's/^0*//' | sed 's/^$/0/')
          PATCH=$(echo "$RAW" | cut -d. -f3 | sed 's/^0*//' | sed 's/^$/0/')
          SEMVER="${MAJOR}.${MINOR}.${PATCH}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$SEMVER\"/" src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$SEMVER\"/" src-tauri/Cargo.toml

      - name: Install system dependencies
        run: |
          dnf install -y \
            gcc gcc-c++ make \
            webkit2gtk4.1-devel \
            libappindicator-gtk3-devel \
            librsvg2-devel \
            patchelf \
            dbus-devel \
            openssl-devel \
            pkg-config \
            curl \
            rpm-build \
            nodejs npm \
            git

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Tauri CLI
        run: |
          source "$HOME/.cargo/env"
          cargo install tauri-cli --version "^2"

      - name: Install frontend deps & build
        working-directory: ui
        run: |
          npm install
          npm run build

      - name: Build Tauri (RPM)
        run: |
          source "$HOME/.cargo/env"
          cargo tauri build --bundles rpm

      - name: Collect RPM
        id: rpm
        run: |
          FILEVER=$(echo "${GITHUB_REF_NAME#v}" | tr -d '.')
          mkdir -p release-artifacts
          RPM=$(find src-tauri/target/release/bundle/rpm -name "*.rpm" | head -1)
          if [ -n "$RPM" ]; then
            cp "$RPM" "release-artifacts/meshguard-${FILEVER}-x86_64.rpm"
          fi

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: release-artifacts/

  # ──────────────────────────────────────────────
  # macOS (.dmg + .app)
  # ──────────────────────────────────────────────
  build-macos:
    name: macOS (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          RAW=${GITHUB_REF_NAME#v}
          MAJOR=$(echo "$RAW" | cut -d. -f1)
          MINOR=$(echo "$RAW" | cut -d. -f2 | sed 's/^0*//' | sed 's/^$/0/')
          PATCH=$(echo "$RAW" | cut -d. -f3 | sed 's/^0*//' | sed 's/^$/0/')
          SEMVER="${MAJOR}.${MINOR}.${PATCH}"
          echo "Setting semver to $SEMVER"
          sed -i '' "s/\"version\": \".*\"/\"version\": \"$SEMVER\"/" src-tauri/tauri.conf.json
          sed -i '' "s/^version = \".*\"/version = \"$SEMVER\"/" src-tauri/Cargo.toml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps & build
        working-directory: ui
        run: |
          npm install
          npm run build

      - name: Build Tauri (macOS universal)
        run: cargo tauri build --target universal-apple-darwin

      - name: Collect artifacts
        id: artifacts
        run: |
          FILEVER=$(echo "${GITHUB_REF_NAME#v}" | tr -d '.')
          mkdir -p release-artifacts
          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -n "$DMG" ]; then
            cp "$DMG" "release-artifacts/meshguard-${FILEVER}-universal-macos.dmg"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release-artifacts/

  # ──────────────────────────────────────────────
  # Create GitHub Release
  # ──────────────────────────────────────────────
  publish-release:
    name: Publish Release
    needs: [build-android, build-linux-ubuntu, build-linux-rpm, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          # The App Bundle is for Google Play only, not a public download.
          rm -f artifacts/*.aab
          find artifacts -type f | sort

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
          body: |
            ## MeshGuard ${{ github.ref_name }}

            Secure peer-to-peer encrypted messenger for Meshtastic devices.

            ### Downloads

            | Platform | File |
            |----------|------|
            | Android (direct) | [`meshguard-android.apk`](https://github.com/nemke82/meshguard/releases/latest/download/meshguard-android.apk) |
            | Android (IzzyOnDroid) | [F-Droid / IzzyOnDroid](https://apt.izzysoft.de/fdroid/index/apk/com.meshguard.app) |
            | Ubuntu/Debian | `meshguard-*-amd64.deb` |
            | RHEL/Fedora | `meshguard-*-x86_64.rpm` |
            | Linux (universal) | `meshguard-*-x86_64.AppImage` |
            | macOS (universal) | `meshguard-*-universal-macos.dmg` |

            ### Verify integrity
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
