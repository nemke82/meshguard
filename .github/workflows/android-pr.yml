name: Android PR Build

# Kotlin (patch-android.sh) and Android-only Rust (cfg(target_os = "android"))
# are not compiled by ci.yml, so without this they would only meet a compiler
# on a release tag. Same steps as the release build, arm64 only, unsigned and
# without secrets (works for forks too).
#
# Runs only for pull requests that touch code that ends up in the Android
# build; the signed builds still come from release.yml on a tag.

on:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "crates/**"
      - "scripts/patch-android.sh"
      - "android/**"
      # Frontend build setup (not ui/src: app code cannot break the APK build)
      - "ui/package.json"
      - "ui/package-lock.json"
      - "ui/vite.config.*"
      - ".github/workflows/android-pr.yml"
  workflow_dispatch:

concurrency:
  group: android-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android Build (arm64, unsigned)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android NDK
        run: sdkmanager "ndk;${NDK_VERSION}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Install Tauri CLI
        # Restored from the cache (~/.cargo/bin) after the first run.
        run: command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: ui
        run: |
          npm install
          npm run build

      - name: Initialize and patch Android project
        run: |
          cargo tauri android init
          bash scripts/patch-android.sh

      - name: Build release APK (R8 included)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: cargo tauri android build --apk --target aarch64
