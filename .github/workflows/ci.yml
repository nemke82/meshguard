name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check
        working-directory: src-tauri
        run: cargo check

      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

  core:
    name: Core Crate (fmt, clippy, test, vectors)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/meshguard-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/meshguard-core

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Test vectors match independent implementation
        run: |
          python3 -m pip install --quiet cryptography
          python3 -I tests/vectors/gen_vectors.py | diff -u tests/vectors/vectors.rs -

  frontend:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build
        working-directory: ui
        run: |
          npm install
          npm run build

  android:
    # Kotlin (patch-android.sh) and Android-only Rust (cfg(target_os =
    # "android")) are not compiled by the jobs above, so without this they
    # would only meet a compiler on a release tag. Same steps as the release
    # build, arm64 only, unsigned and without secrets (works for forks too).
    name: Android Build (arm64, unsigned)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android NDK
        run: sdkmanager "ndk;${NDK_VERSION}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Install Tauri CLI
        # Restored from the cache (~/.cargo/bin) after the first run.
        run: command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: ui
        run: |
          npm install
          npm run build

      - name: Initialize and patch Android project
        run: |
          cargo tauri android init
          bash scripts/patch-android.sh

      - name: Build release APK (R8 included)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: cargo tauri android build --apk --target aarch64
